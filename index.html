<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CID VPN v2.0 - Быстрый и стабильный VPN</title>
    <style>
        /* Основные переменные цветов */
        :root {
            --bg-dark: #0a0f0a;
            --accent-green: #39ff14;
            --accent-green-dim: #00cc33;
            --text-primary: #e0ffe0;
            --text-secondary: #a8dda8;
            --border-color: rgba(57, 255, 20, 0.3);
            --glow-color: rgba(57, 255, 20, 0.5);
        }

        /* Сброс стилей и базовые параметры */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-primary);
            line-height: 1.6;
            overflow-x: hidden;
            background: linear-gradient(135deg, #0a0f0a 0%, #0d150d 50%, #0a0f0a 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Контейнер страницы */
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 20px;
            width: 100%;
        }

        /* ========== HERO СЕКЦИЯ ========== */
        .hero {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 60vh;
            padding: 60px 20px;
            text-align: center;
            animation: fadeIn 1.2s ease-in-out;
        }

        .logo {
            max-width: 200px;
            height: auto;
            margin-bottom: 40px;
            animation: glow-pulse 3s ease-in-out infinite;
            filter: drop-shadow(0 0 15px var(--glow-color));
        }

        .hero h1 {
            font-size: clamp(2rem, 8vw, 3.5rem);
            color: var(--accent-green);
            margin-bottom: 30px;
            font-weight: 700;
            text-shadow: 0 0 20px rgba(57, 255, 20, 0.4);
            animation: slideDown 1s ease-out;
            letter-spacing: -1px;
        }

        .telegram-btn {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            background-color: transparent;
            border: 2px solid var(--accent-green);
            color: var(--accent-green);
            padding: 12px 28px;
            font-size: 1rem;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: inherit;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            text-decoration: none;
            display: inline-flex;
        }

        .telegram-btn:hover {
            background-color: rgba(57, 255, 20, 0.1);
            box-shadow: 0 0 20px var(--glow-color);
            transform: scale(1.05);
        }

        .telegram-btn:active {
            transform: scale(0.98);
        }

        .telegram-icon {
            font-size: 1.3rem;
        }

        /* ========== MAIN CONTENT СЕКЦИЯ ========== */
        .content-section {
            flex: 1;
            padding: 60px 20px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .cards-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 40px;
            width: 100%;
            max-width: 900px;
        }

        .card {
            background-color: rgba(13, 21, 13, 0.8);
            border: 2px solid var(--border-color);
            border-radius: 12px;
            padding: 40px 30px;
            text-align: center;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            backdrop-filter: blur(10px);
            animation: fadeInUp 1s ease-out;
        }

        .card:hover {
            border-color: var(--accent-green);
            box-shadow: 0 0 30px var(--glow-color), inset 0 0 20px rgba(57, 255, 20, 0.1);
            transform: translateY(-8px);
        }

        .card h2 {
            font-size: 1.8rem;
            color: var(--accent-green);
            margin-bottom: 30px;
            font-weight: 600;
            text-shadow: 0 0 10px rgba(57, 255, 20, 0.3);
        }

        /* ========== КНОПКИ ========== */
        .copy-btn {
            display: inline-flex;
            align-items: center;
            gap: 12px;
            background-color: transparent;
            border: 2px solid var(--accent-green);
            color: var(--accent-green);
            padding: 15px 30px;
            font-size: 1.05rem;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: inherit;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            position: relative;
            overflow: hidden;
        }

        .copy-btn:hover {
            background-color: rgba(57, 255, 20, 0.1);
            box-shadow: 0 0 20px var(--glow-color);
            transform: scale(1.05);
        }

        .copy-btn:active {
            transform: scale(0.98);
        }

        .copy-btn.copied {
            animation: pulse-glow 0.6s ease-out;
        }

        .copy-icon {
            font-size: 1.2rem;
        }

        /* ========== FOOTER ========== */
        footer {
            background-color: rgba(10, 15, 10, 0.95);
            border-top: 1px solid var(--border-color);
            padding: 40px 20px;
            text-align: center;
            margin-top: auto;
        }

        .footer-content {
            max-width: 1200px;
            margin: 0 auto;
        }

        .footer-copyright {
            color: var(--accent-green);
            font-size: 1.1rem;
            font-weight: 600;
            margin-bottom: 15px;
        }

        .footer-links {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 20px;
            margin-bottom: 20px;
        }

        .footer-links a {
            color: var(--text-secondary);
            text-decoration: none;
            transition: all 0.3s ease;
            font-size: 0.95rem;
        }

        .footer-links a:hover {
            color: var(--accent-green);
            text-shadow: 0 0 10px var(--glow-color);
        }

        .footer-tagline {
            color: var(--text-secondary);
            font-size: 0.85rem;
            opacity: 0.7;
            font-style: italic;
            margin-top: 15px;
        }

        /* ========== АНИМАЦИИ ========== */
        @keyframes fadeIn {
            from {
                opacity: 0;
            }
            to {
                opacity: 1;
            }
        }

        @keyframes slideDown {
            from {
                opacity: 0;
                transform: translateY(-30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(40px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes glow-pulse {
            0%, 100% {
                filter: drop-shadow(0 0 15px var(--glow-color));
            }
            50% {
                filter: drop-shadow(0 0 25px rgba(57, 255, 20, 0.7));
            }
        }

        @keyframes pulse-glow {
            0% {
                box-shadow: 0 0 20px var(--glow-color);
            }
            50% {
                box-shadow: 0 0 40px var(--glow-color);
            }
            100% {
                box-shadow: 0 0 20px var(--glow-color);
            }
        }

        /* ========== MEDIA QUERIES ========== */
        @media (max-width: 768px) {
            .hero {
                min-height: 50vh;
                padding: 40px 20px;
            }

            .logo {
                max-width: 150px;
                margin-bottom: 30px;
            }

            .hero h1 {
                margin-bottom: 20px;
            }

            .cards-grid {
                gap: 25px;
            }

            .card {
                padding: 30px 20px;
            }

            .copy-btn {
                padding: 12px 24px;
                font-size: 0.95rem;
            }

            .telegram-btn {
                padding: 10px 20px;
                font-size: 0.9rem;
            }

            .footer-links {
                flex-direction: column;
                gap: 10px;
            }
        }
    </style>
</head>
<body>
    <!-- Hero секция -->
    <section class="hero">
        <img src="https://github.com/CidVpn/website-CidVpn/blob/main/i.webp?raw=true" alt="CID VPN Logo" class="logo">
        <h1>Готов ускорить снова ваш интернет!</h1>
        <a href="https://t.me/CID_VPN" target="_blank" rel="noopener noreferrer" class="telegram-btn">
            <span class="telegram-icon">✈️</span>
            <span>Telegram канал</span>
        </a>
    </section>

    <!-- Основной контент -->
    <section class="content-section">
        <div class="cards-grid">
            <!-- Карточка 1: Основная подписка -->
            <div class="card">
                <h2>Основная подписка</h2>
                <button class="copy-btn" data-url="https://raw.githubusercontent.com/CidVpn/cid-vpn-config/refs/heads/main/general.txt">
                    <span class="copy-icon">📋</span>
                    <span class="copy-text">Копировать конфиг</span>
                </button>
            </div>

            <!-- Карточка 2: Белые списки -->
            <div class="card">
                <h2>Белые списки</h2>
                <button class="copy-btn" data-url="https://storage.yandexcloud.net/cid-vpn/whitelist.txt">
                    <span class="copy-icon">📋</span>
                    <span class="copy-text">Копировать ссылку</span>
                </button>
            </div>
        </div>
    </section>

    <!-- Footer -->
    <footer>
        <div class="footer-content">
            <div class="footer-copyright">© 2026 CID VPN</div>
            <div class="footer-links">
                <a href="https://github.com/CidVpn" target="_blank" rel="noopener noreferrer">GitHub</a>
                <a href="https://github.com/CidVpn/cid-vpn-config" target="_blank" rel="noopener noreferrer">Проект</a>
            </div>
            <div class="footer-tagline">Мы не храним логи. Ваш интернет — только ваш.</div>
        </div>
    </footer>

    <script>
        // Функция копирования в буфер обмена с визуальной обратной связью
        document.querySelectorAll('.copy-btn').forEach(button => {
            button.addEventListener('click', async function() {
                const url = this.getAttribute('data-url');
                const originalText = this.querySelector('.copy-text').textContent;
                
                try {
                    // Копируем текст в буфер обмена
                    await navigator.clipboard.writeText(url);
                    
                    // Меняем текст и добавляем класс для анимации
                    this.querySelector('.copy-text').textContent = 'Скопировано!';
                    this.classList.add('copied');
                    
                    // Возвращаем оригинальный текст через 2 секунды
                    setTimeout(() => {
                        this.querySelector('.copy-text').textContent = originalText;
                        this.classList.remove('copied');
                    }, 2000);
                } catch (err) {
                    // Fallback для браузеров без поддержки Clipboard API
                    console.error('Ошибка копирования:', err);
                    this.querySelector('.copy-text').textContent = 'Ошибка!';
                    setTimeout(() => {
                        this.querySelector('.copy-text').textContent = originalText;
                    }, 2000);
                }
            });
        });
    </script>
</body>
</html>
