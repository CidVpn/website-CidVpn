<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CID VPN</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --neon-green: #00ff88;
            --neon-green-glow: rgba(0, 255, 136, 0.4);
            --dark-bg: #050b08;
            --glass-bg: rgba(15, 25, 20, 0.6);
            --glass-border: rgba(0, 255, 136, 0.15);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Montserrat', sans-serif;
        }

        body {
            background-color: var(--dark-bg);
            background-image: 
                radial-gradient(circle at 50% -20%, #0f4c3a 0%, transparent 50%),
                radial-gradient(circle at 100% 100%, #082b1d 0%, transparent 50%);
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
            overflow-x: hidden;
        }

        /* Декоративные элементы на фоне */
        .glow-circle {
            position: absolute;
            width: 300px;
            height: 300px;
            background: var(--neon-green);
            border-radius: 50%;
            filter: blur(150px);
            opacity: 0.15;
            z-index: -1;
            animation: float 10s infinite alternate;
        }

        @keyframes float {
            0% { transform: translate(0, 0) scale(1); }
            100% { transform: translate(50px, 50px) scale(1.2); }
        }

        .container {
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            border-radius: 24px;
            padding: 50px 40px;
            max-width: 700px;
            width: 100%;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.5), inset 0 0 0 1px rgba(255, 255, 255, 0.05);
            text-align: center;
            position: relative;
            z-index: 1;
        }

        h1 {
            font-size: 3.5rem;
            font-weight: 800;
            margin-bottom: 15px;
            text-transform: uppercase;
            letter-spacing: 3px;
            background: linear-gradient(to right, #ffffff, var(--neon-green));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 30px var(--neon-green-glow);
        }

        .description {
            font-size: 1.15rem;
            line-height: 1.6;
            margin-bottom: 25px;
            color: #b3c5bc;
            font-weight: 400;
        }

        .release-date {
            display: inline-block;
            font-size: 1rem;
            font-weight: 600;
            color: var(--dark-bg);
            background: var(--neon-green);
            padding: 8px 20px;
            border-radius: 50px;
            margin-bottom: 40px;
            box-shadow: 0 0 15px var(--neon-green-glow);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        /* Секция подписок */
        .subs-container {
            text-align: left;
            margin-bottom: 40px;
            background: rgba(0, 0, 0, 0.3);
            padding: 25px;
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .sub-group {
            margin-bottom: 20px;
        }
        
        .sub-group:last-child {
            margin-bottom: 0;
        }

        .sub-label {
            display: block;
            margin-bottom: 8px;
            font-size: 0.95rem;
            color: #e2f0e9;
            font-weight: 600;
        }

        .copy-wrapper {
            display: flex;
            gap: 10px;
        }

        .copy-input {
            flex-grow: 1;
            background: rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(0, 255, 136, 0.3);
            color: #a7f3d0;
            padding: 12px 15px;
            border-radius: 10px;
            font-family: monospace;
            font-size: 0.9rem;
            outline: none;
            transition: border-color 0.3s ease;
        }

        .copy-input:focus {
            border-color: var(--neon-green);
            box-shadow: 0 0 10px var(--neon-green-glow);
        }

        .btn-copy {
            background: rgba(0, 255, 136, 0.1);
            color: var(--neon-green);
            border: 1px solid var(--neon-green);
            padding: 0 20px;
            border-radius: 10px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.9rem;
            transition: all 0.3s ease;
            white-space: nowrap;
        }

        .btn-copy:hover {
            background: var(--neon-green);
            color: var(--dark-bg);
            box-shadow: 0 0 15px var(--neon-green-glow);
        }

        .btn-copy.copied {
            background: #ffffff;
            color: var(--dark-bg);
            border-color: #ffffff;
        }

        /* Кнопки соцсетей */
        .actions {
            display: flex;
            gap: 20px;
            justify-content: center;
        }

        .btn-social {
            flex: 1;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 16px 20px;
            border-radius: 14px;
            text-decoration: none;
            font-weight: 600;
            font-size: 1.05rem;
            color: var(--dark-bg);
            background: var(--neon-green);
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
            box-shadow: 0 5px 15px var(--neon-green-glow);
        }

        .btn-social::before {
            content: '';
            position: absolute;
            top: 0; left: -100%;
            width: 100%; height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.4), transparent);
            transition: all 0.5s ease;
        }

        .btn-social:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 25px rgba(0, 255, 136, 0.5);
        }

        .btn-social:hover::before {
            left: 100%;
        }

        /* Подвал */
        footer {
            margin-top: 30px;
            font-size: 0.9rem;
            color: rgba(255, 255, 255, 0.3);
            letter-spacing: 1px;
            font-weight: 600;
        }

        /* Адаптация для телефонов */
        @media (max-width: 600px) {
            .container {
                padding: 30px 20px;
            }
            h1 { font-size: 2.5rem; }
            .copy-wrapper {
                flex-direction: column;
            }
            .btn-copy {
                padding: 12px;
            }
            .actions {
                flex-direction: column;
                gap: 15px;
            }
        }
    </style>
</head>
<body>

    <div class="glow-circle"></div>

    <div class="container">
        <h1>CID VPN</h1>
        
        <p class="description">
            Мы вернулись с новой версией и готовы ускорить ваш интернет! Вы этого очень ждали и вы дождались!
        </p>

        <div class="release-date">
            Дата выхода: Скоро...
        </div>

        <div class="subs-container">
            <!-- Основная подписка -->
            <div class="sub-group">
                <label class="sub-label">Основная подписка:</label>
                <div class="copy-wrapper">
                    <input type="text" id="sub-main" class="copy-input" value="https://raw.githubusercontent.com/CidVpn/cid-vpn-config/refs/heads/main/general.txt" readonly>
                    <button class="btn-copy" onclick="copyText('sub-main', this)">Копировать</button>
                </div>
            </div>

            <!-- Белые списки -->
            <div class="sub-group">
                <label class="sub-label">Белые списки:</label>
                <div class="copy-wrapper">
                    <input type="text" id="sub-white" class="copy-input" value="https://gitverse.ru/api/repos/cid-uskoritel/cid-white/raw/branch/master/whitelist.txt" readonly>
                    <button class="btn-copy" onclick="copyText('sub-white', this)">Копировать</button>
                </div>
            </div>
        </div>

        <div class="actions">
            <a href="https://t.me/CID_VPN" target="_blank" class="btn-social">Телеграм канал</a>
            <a href="https://t.me/CID_VPN_bot" target="_blank" class="btn-social">Наш Бот</a>
        </div>
    </div>

    <footer>
        ВЕРСИЯ CID VPN v3.0
    </footer>

    <script>
        // Функция для копирования текста
        function copyText(inputId, btnElement) {
            const input = document.getElementById(inputId);
            
            // Выделяем текст
            input.select();
            input.setSelectionRange(0, 99999); // Для мобильных устройств
            
            // Копируем в буфер обмена
            navigator.clipboard.writeText(input.value).then(() => {
                // Визуальный отклик кнопки
                const originalText = btnElement.innerText;
                btnElement.innerText = 'Скопировано!';
                btnElement.classList.add('copied');
                
                // Возвращаем исходный текст через 2 секунды
                setTimeout(() => {
                    btnElement.innerText = originalText;
                    btnElement.classList.remove('copied');
                }, 2000);
            }).catch(err => {
                console.error('Ошибка копирования: ', err);
            });
        }
    </script>
</body>
</html>
